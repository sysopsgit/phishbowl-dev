<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in - PhishAware</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="theme.js"></script>
</head>
<body>
  <div class="auth-overlay" style="display:flex;">
    <div class="auth-box">
      <div class="brand-mark" style="margin:0 auto 16px;">P</div>
      <h2 id="authTitle">Sign in</h2>
      <p id="authMessage">Sign in with your organisation account to continue.</p>
      <button class="signin-btn" id="signinBtn" onclick="browserSignIn()">Sign in with Microsoft</button>
    </div>
  </div>

  <script>
    var params = new URLSearchParams(window.location.search);
    var denied = params.get("denied") === "1";

    function browserSignIn() {
      var redirect = window.location.origin + "/close.html";
      var url = "/.auth/login/aad?post_login_redirect_uri=" + encodeURIComponent(redirect);
      var popup = window.open(url, "phishaware-login", "width=600,height=700");
      var timer = setInterval(function () {
        if (!popup || popup.closed) {
          clearInterval(timer);
          window.location.href = "/";
        }
      }, 500);
    }

    if (denied) {
      document.getElementById("authTitle").textContent = "Access denied";
      document.getElementById("authMessage").textContent = "This resource is restricted to organisation accounts only.";
      document.getElementById("signinBtn").style.display = "none";
    }
  </script>
</body>
</html>
